[project]
name = "bjj-roll-workers"
version = "0.0.0"
description = "BJJ-Roll Python workers"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 150
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
