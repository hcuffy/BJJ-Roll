packages:
  - "packages/*"
# Build scripts stay disabled (pnpm default). These come in via testcontainers (ssh2) and the Modal SDK (cbor-extract, HEN-227) and are optional or check-only.
minimumReleaseAge: 20160
# HEN-337: Henry approved 31 Oct; remove this exclusion on 10 Nov, when these releases pass the 14-day age.
minimumReleaseAgeExclude:
  - glob
  - minimatch
  - node-forge
  - path-scurry
allowBuilds:
  cbor-extract: false
  cpu-features: false
  protobufjs: false
  ssh2: false
# Security fixes found by OSV-Scanner (HEN-222). Drop each when upstream ships the fix.
overrides:
  vite@<8.3.3: ^8.3.3
  xcode>uuid: 11.1.1
  # @expo/ui pulls vaul (web drawer); keep its react-dom peer on React 19.2.3 from Expo SDK 57 (HEN-46).
  vaul>react-dom: 19.2.3
  node-forge@<1.4.1: 1.4.1
