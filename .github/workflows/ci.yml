name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default; a job raises only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Steps run in CONVENTIONS order: leakcheck -> install -> typecheck -> frontend build -> lint -> test.
# Python (packages/workers) follows the same order: uv sync at install, Ruff at lint, pytest at test.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Leakcheck (pre-commit hook self-test)
        run: pnpm test:hooks
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Python workers
        working-directory: packages/workers
        run: |
          uv sync --locked
          uv run python --version
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck mobile
        run: pnpm --filter @bjj-roll/mobile typecheck
      - name: Frontend build (mobile Android bundle, web frontend typecheck and build)
        run: |
          pnpm --filter @bjj-roll/mobile bundle
          pnpm --filter @bjj-roll/frontend typecheck
          pnpm --filter @bjj-roll/frontend build
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Lint Python workers (Ruff)
        working-directory: packages/workers
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Test
        run: pnpm test
      - name: Check no leftover Postgres test containers
        run: test -z "$(docker ps -aq --filter ancestor=postgres:18.6)" && echo "No leftover postgres:18.6 containers"
      - name: Test Python workers (pytest)
        working-directory: packages/workers
        run: uv run pytest -v
