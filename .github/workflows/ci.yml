name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:hooks
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check no leftover Postgres test containers
        run: test -z "$(docker ps -aq --filter ancestor=postgres:18.6)" && echo "No leftover postgres:18.6 containers"
      - run: pnpm --filter @bjj-roll/mobile typecheck
      - run: pnpm --filter @bjj-roll/mobile bundle

  workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/workers
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run python --version
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -v
