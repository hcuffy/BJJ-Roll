name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default; a job raises only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Steps run in CONVENTIONS order: leakcheck -> install -> typecheck -> frontend build -> lint -> test.
# Python (packages/workers: Ruff + pytest) joins as its own job once it is on main (HEN-56).
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Leakcheck (pre-commit hook self-test)
        run: pnpm test:hooks
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck mobile
        run: pnpm --filter @bjj-roll/mobile typecheck
      - name: Frontend build (mobile Android bundle)
        run: pnpm --filter @bjj-roll/mobile bundle
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Check no leftover Postgres test containers
        run: test -z "$(docker ps -aq --filter ancestor=postgres:18.6)" && echo "No leftover postgres:18.6 containers"
