name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token by default; a job raises only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Steps run in CONVENTIONS order: leakcheck -> install -> typecheck -> frontend build -> lint -> test.
# Python (packages/workers) follows the same order: uv sync at install, Ruff at lint, pytest at test.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - name: Leakcheck (pre-commit hook self-test)
        run: pnpm test:hooks
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Python workers
        working-directory: packages/workers
        run: |
          uv sync --locked
          uv run python --version
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck mobile
        run: pnpm --filter @bjj-roll/mobile typecheck
      # expo-doctor from the pinned devDependency; patch-behind Expo packages warn, major/minor mismatches fail (HEN-272).
      - name: Expo doctor (mobile)
        run: pnpm --filter @bjj-roll/mobile run doctor
      - name: Frontend build (mobile Android bundle)
        run: pnpm --filter @bjj-roll/mobile bundle
      - name: Frontend build (mobile iOS bundle)
        run: pnpm --filter @bjj-roll/mobile exec expo export --platform ios --output-dir dist
      - name: Frontend build (web frontend typecheck and build)
        run: |
          pnpm --filter @bjj-roll/frontend typecheck
          pnpm --filter @bjj-roll/frontend build
      - name: Lint
        run: pnpm lint
      - name: Modal EU residency guard (HEN-227)
        run: |
          sh scripts/checkModalResidency.test.sh
          sh scripts/checkModalResidency.sh
      # The Modal image pins Python 3.13 while the repo pins 3.15, so the Modal-side code must still compile on 3.13.
      # Syntax only: nothing is installed, so `modal` is never imported.
      - name: Modal code compiles on Python 3.13 (HEN-227)
        working-directory: packages/workers
        run: uv run --no-project --python 3.13 python -m compileall -q src/bjj_roll_workers tests/test_modal_app_eu_residency.py tests/test_modal_call_input_rejects_user_data.py
      # No outside payment, tip or donation links in the mobile app (HEN-278; lists and docs in docs/release.md).
      - name: Payment link guard (mobile)
        run: pnpm --filter @bjj-roll/mobile run payment-guard
      - name: Format check
        run: pnpm format:check
      - name: Lint Python workers (Ruff)
        working-directory: packages/workers
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Test
        run: pnpm test
      - name: Check no leftover Postgres test containers
        run: test -z "$(docker ps -aq --filter ancestor=postgres:18.6)" && echo "No leftover postgres:18.6 containers"
      - name: Test Python workers (pytest)
        working-directory: packages/workers
        run: uv run pytest -v
