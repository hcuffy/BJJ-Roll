# Dependabot version updates (HEN-221). `cooldown.default-days: 14` matches pnpm `minimumReleaseAge` and `.ncurc.json`.
# Cooldown delays version updates only; security updates are not delayed.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    # React Native/Expo/React follow the Expo SDK; bump with the SDK.
    ignore:
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "expo*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14

  # uv (`packages/workers`): re-add when Dependabot supports Python 3.15. OSV-Scanner already scans `uv.lock`.
