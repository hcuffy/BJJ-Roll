# Dependabot version updates (HEN-221). `cooldown.default-days: 14` matches pnpm `minimumReleaseAge` and `.ncurc.json`.
# Cooldown delays version updates only; security updates are not delayed.
# One weekly PR: every ecosystem below joins the `all-dependencies` multi-ecosystem group, and `patterns: ["*"]`
# takes every update type (major, minor and patch), so updates no longer conflict with each other.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 14
    # React Native/Expo/React follow the Expo SDK; bump with the SDK (`expo install --fix`), not Dependabot.
    # `pnpm --filter @bjj-roll/mobile run doctor` (scripts/expoVersionCheck.ts) fails CI on any minor or major
    # drift from the SDK, and on any change to an exact SDK pin. Patches inside the SDK's `~` range still flow.
    ignore:
      # Exact SDK pins: ignore every update, patch included.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      # SDK `~` ranges (expo, expo-*, @expo/ui, react-native-safe-area-context): patches only.
      - dependency-name: "expo*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The project runs Node 24 (`.nvmrc`); `@types/node` majors track newer Node lines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 14
    groups:
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # uv (`packages/workers`): re-add when Dependabot supports Python 3.15. OSV-Scanner already scans `uv.lock`.
